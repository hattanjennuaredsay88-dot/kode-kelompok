<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — School Canteen Simulator</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><a class="back-home" href="index.html">← Kembali ke beranda</a><main class="auth-card"><div class="auth-illustration"><span class="pixel-logo pixel-logo-large" aria-label="Logo pixel kantin"></span></div><span class="eyebrow">JOIN OUR CANTEEN</span><h1>Create Account</h1><p class="muted">Buat akun untuk membuka kantin pertamamu.</p><form id="registerForm"><label>Nama pengguna<input id="regUsername" type="text" autocomplete="username" minlength="3" maxlength="18" placeholder="Contoh: Yoru" required></label><label>Kata sandi<input id="regPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Minimal 6 karakter" required></label><label>Konfirmasi kata sandi<input id="regConfirm" type="password" autocomplete="new-password" placeholder="Ulangi kata sandi" required></label><button class="button button-full" type="submit">Daftar Sekarang</button><p class="form-message" id="registerMessage" aria-live="polite"></p></form><p class="auth-switch">Sudah punya akun? <a href="login.html">Login di sini</a></p></main><script src="app.js"></script></body></html>
